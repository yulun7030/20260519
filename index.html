<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 手勢剪刀石頭布</title>
    <!-- 引入 MediaPipe 必要腳本 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <!-- 繪圖工具，用來在畫面上畫出手指關節點（非強制，但方便偵測） -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        /* 遊戲畫面切換控制 */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .active {
            display: flex;
        }

        /* 歡迎畫面樣式 */
        #start-screen h1 {
            font-size: 3rem;
            color: #333;
            margin-bottom: 20px;
        }
        .btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        /* 遊戲主畫面樣式 */
        #game-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .video-box {
            position: relative;
            width: 480px;
            height: 360px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }
        #webcam {
            transform: scaleX(-1); /* 鏡像翻轉，讓視訊直覺 */
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #output_canvas {
            transform: scaleX(-1);
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }
        .info-box {
            width: 300px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .status-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: #555;
        }
        #result {
            font-size: 2rem;
            font-weight: bold;
            margin: 20px 0;
            color: #e91e63;
        }
        #countdown {
            font-size: 4rem;
            color: #ff9800;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 1. 歡迎畫面 -->
    <div id="start-screen" class="screen active">
        <h1>AI 手勢剪刀石頭布</h1>
        <p>準備好你的攝影機，用真實手勢跟電腦對決！</p>
        <button class="btn" onclick="startGame()">開始遊戲</button>
    </div>

    <!-- 2. 遊戲主畫面 -->
    <div id="game-screen" class="screen">
        <div id="game-container">
            <!-- 左側：視訊與 AI 偵測畫面 -->
            <div class="video-box">
                <video id="webcam" autoplay playsinline muted></video>
                <canvas id="output_canvas"></canvas>
            </div>
            
            <!-- 右側：遊戲狀態與結果 -->
            <div class="info-box">
                <div>
                    <div class="status-text">你的手勢：<span id="user-gesture">偵測中...</span></div>
                    <div class="status-text">電腦選擇：<span id="ai-choice">-</span></div>
                </div>
                
                <div>
                    <div id="countdown"></div>
                    <div id="result">準備出拳！</div>
                </div>

                <button class="btn" id="round-btn" onclick="startRound()">出拳！</button>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        let currentGesture = "未知";
        let isGaming = false;

        // 畫布尺寸初始化
        canvasElement.width = 480;
        canvasElement.height = 360;

        // 切換畫面
        function startGame() {
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            initMediaPipe(); // 進入畫面後才啟動相機
        }

        // 初始化 MediaPipe Hands
        function initMediaPipe() {
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onResults);

            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 480,
                height: 360
            });
            camera.start();
        }

        // 核心邏輯：判斷剪刀石頭布
        // 原理：根據手指尖端(Tip) 是否高於 手指根部關節(PIP) 來判斷手指是否張開
        function judgeGesture(landmarks) {
            // MediaPipe 手指關節點 ID:
            // 食指: 8(Tip), 6(PIP) | 中指: 12(Tip), 10(PIP) | 無名指: 16(Tip), 14(PIP) | 小指: 20(Tip), 18(PIP)
            // 大拇指比較特殊，這邊用水平距離或簡單以 4(Tip) 和 3(IP) 判斷
            
            const thumbOpen = landmarks[4].x < landmarks[3].x; // 簡化判斷
            const indexOpen = landmarks[8].y < landmarks[6].y;
            const middleOpen = landmarks[12].y < landmarks[10].y;
            const ringOpen = landmarks[16].y < landmarks[14].y;
            const pinkyOpen = landmarks[20].y < landmarks[18].y;

            // 統計張開的手指數（不包含大拇指，防呆較穩）
            const openFingersCount = [indexOpen, middleOpen, ringOpen, pinkyOpen].filter(Boolean).length;

            if (openFingersCount === 0) {
                return "石頭";
            } else if (indexOpen && middleOpen && !ringOpen && !pinkyOpen) {
                return "剪刀";
            } else if (openFingersCount >= 3) {
                return "布";
            }
            return "偵測中...";
        }

        // 接收 MediaPipe 辨識結果
        function onResults(results) {
            // 清除畫布
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // 描繪骨架給玩家看
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 4});
                drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1, radius: 4});
                
                // 辨識手勢
                currentGesture = judgeGesture(landmarks);
                document.getElementById('user-gesture').innerText = currentGesture;
            } else {
                currentGesture = "未偵測到手";
                document.getElementById('user-gesture').innerText = currentGesture;
            }
        }

        // 開始回合（倒數計時）
        function startRound() {
            if (isGaming) return;
            isGaming = true;
            
            let count = 3;
            const countdownEl = document.getElementById('countdown');
            const resultEl = document.getElementById('result');
            const roundBtn = document.getElementById('round-btn');
            
            roundBtn.disabled = true;
            resultEl.innerText = "預備...";
            countdownEl.innerText = count;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.innerText = count;
                } else {
                    clearInterval(timer);
                    countdownEl.innerText = "";
                    playGame();
                }
            }, 1000);
        }

        // 判定勝負
        function playGame() {
            const choices = ["剪刀", "石頭", "布"];
            const aiChoice = choices[Math.floor(Math.random() * 3)];
            document.getElementById('ai-choice').innerText = aiChoice;

            const userChoice = currentGesture;
            const resultEl = document.getElementById('result');

            if (userChoice === "未偵測到手" || userChoice === "偵測中...") {
                resultEl.innerText = "❌ 沒抓到你的手勢，請重來！";
            } else if (userChoice === aiChoice) {
                resultEl.innerText = "平手！ 🤝";
            } else if (
                (userChoice === "剪刀" && aiChoice === "布") ||
                (userChoice === "石頭" && aiChoice === "剪刀") ||
                (userChoice === "布" && aiChoice === "石頭")
            ) {
                resultEl.innerText = "你贏了！ 🎉";
            } else {
                resultEl.innerText = "你輸了... 😢";
            }

            // 恢復按鈕
            document.getElementById('round-btn').disabled = false;
            isGaming = false;
        }
    </script>
</body>
</html>
